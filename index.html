<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KV cache: persist or recompute?</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <h1>KV cache: persist or recompute?</h1>
  <p class="sub">Expected cost per 1,000 conversations vs. retention window. Conversations are sets of KV blocks: a shared prefix plus unique blocks.</p>

  <div class="grid">
    <fieldset><legend>Conversation</legend>
      <label>Total tokens <span class="v" id="o-tokens"></span></label>
      <input type="range" id="tokens" min="1000" max="1000000" step="1000">
      <label>Shared prefix tokens <span class="v" id="o-sharedTokens"></span></label>
      <input type="range" id="sharedTokens" min="0" max="200000" step="1000">
      <label>Conversations sharing the prefix <span class="v" id="o-sharers"></span></label>
      <input type="range" id="sharers" min="1" max="10000" step="1">
      <label>Prefix still cached on return (h) <span class="v" id="o-residency"></span></label>
      <input type="range" id="residency" min="0" max="100" step="1">
      <label>Share attribution</label>
      <select id="shareMode">
        <option value="average">Average share (1 / sharers)</option>
      </select>
      <div id="holdRow" hidden>
        <label>Chance each other sharer keeps it alive <span class="v" id="o-holdProb"></span></label>
        <input type="range" id="holdProb" min="0" max="100" step="1">
      </div>
    </fieldset>
    <fieldset><legend>Return behavior</legend>
      <label>Chance user ever returns (P) <span class="v" id="o-pReturn"></span></label>
      <input type="range" id="pReturn" min="0" max="100" step="1">
      <label>Typical days until return (tau) <span class="v" id="o-tauDays"></span></label>
      <input type="range" id="tauDays" min="0.25" max="14" step="0.25">
    </fieldset>
    <fieldset><legend>Infrastructure</legend>
      <label>Compute price ($/GPU-hour) <span class="v" id="o-gpuPrice"></span></label>
      <input type="range" id="gpuPrice" min="0.5" max="10" step="0.05">
      <label>Storage tier</label><select id="tierId"></select>
      <label>KV compression</label><select id="compression"></select>
    </fieldset>
  </div>

  <div id="verdict"></div>
  <div class="stats" id="stats"></div>
  <div id="chart"></div>
  <div class="legend">
    <span><i style="background:var(--storage)"></i>Storage</span>
    <span><i style="background:var(--recompute)"></i>Expected re-prefill</span>
    <span><i style="background:var(--total)"></i>Total</span>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/model.js"></script>
<script src="js/app.js"></script>
</body>
</html>
